<nav class="main-nav" [attr.aria-label]="'common.categories' | translate" (keydown.escape)="closeAll()">
  <a routerLink="/" routerLinkActive="main-nav__link--active" [routerLinkActiveOptions]="{ exact: true }" class="main-nav__link">
    {{ 'common.home' | translate }}
  </a>

  <div class="main-nav__item" *ngFor="let category of categories" [class.main-nav__item--open]="isOpen(category.id)">
    <a
      class="main-nav__link"
      routerLink="/products"
      [queryParams]="{ categoryId: category.id }"
    >
      {{ category.name }}
    </a>

    <button
      *ngIf="category.children.length"
      type="button"
      class="main-nav__caret"
      [attr.aria-expanded]="isOpen(category.id)"
      [attr.aria-controls]="'main-nav-dropdown-' + category.id"
      [attr.aria-label]="category.name"
      (click)="toggle(category.id)"
    >
      <i class="pi pi-angle-down" aria-hidden="true"></i>
    </button>

    <div
      *ngIf="category.children.length"
      [id]="'main-nav-dropdown-' + category.id"
      class="main-nav__dropdown"
    >
      <a
        *ngFor="let child of category.children"
        class="main-nav__dropdown-link"
        routerLink="/products"
        [queryParams]="{ categoryId: child.id }"
        (click)="closeAll()"
      >
        {{ child.name }}
      </a>
    </div>
  </div>

  <a routerLink="/products" class="main-nav__link">
    {{ 'common.allProducts' | translate }}
  </a>
  <a routerLink="/about" class="main-nav__link">
    {{ 'common.about' | translate }}
  </a>
  <a routerLink="/contact" class="main-nav__link">
    {{ 'common.contact' | translate }}
  </a>
</nav>
