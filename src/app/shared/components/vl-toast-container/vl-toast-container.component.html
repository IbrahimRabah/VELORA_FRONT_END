<div class="vl-toast-container" *ngIf="items().length">
  <div
    *ngFor="let item of items()"
    class="vl-toast"
    [ngClass]="'vl-toast--' + item.message.severity"
    [attr.role]="role(item.message.severity)"
    (mouseenter)="pause(item.message.id)"
    (mouseleave)="resume(item.message.id)"
  >
    <i class="pi vl-toast__icon" [ngClass]="icon(item.message.severity)" aria-hidden="true"></i>
    <div class="vl-toast__body">
      <p class="vl-toast__summary" *ngIf="item.message.summary">{{ item.message.summary }}</p>
      <p class="vl-toast__message">{{ item.message.detail }}</p>
    </div>
    <button
      type="button"
      class="vl-toast__close"
      (click)="dismiss(item.message.id)"
      [attr.aria-label]="'common.close' | translate"
    >
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>
</div>
