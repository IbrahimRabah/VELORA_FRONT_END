<section class="about-story section">
  <div class="container-vl about-story__grid">
    <div class="about-story__image-wrap">
      <img
        class="about-story__image"
        src="assets/images/about/story.png"
        [alt]="'about.story.imageAlt' | translate"
        loading="lazy"
        decoding="async"
      />
    </div>

    <div class="about-story__content">
      <p class="about-story__eyebrow">{{ 'about.story.eyebrow' | translate }}</p>
      <h2 class="about-story__heading">
        <span>{{ 'about.story.headingLine1' | translate }}</span>
        <span>{{ 'about.story.headingLine2' | translate }}</span>
      </h2>
      <p class="about-story__paragraph">{{ 'about.story.paragraph1' | translate }}</p>
      <p class="about-story__paragraph">{{ 'about.story.paragraph2' | translate }}</p>
      <p class="about-story__paragraph">{{ 'about.story.paragraph3' | translate }}</p>
    </div>
  </div>
</section>
