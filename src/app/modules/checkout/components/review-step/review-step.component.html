<section class="checkout-card checkout-card-enter">
  <div class="checkout-card__head">
    <span class="checkout-card__badge" aria-hidden="true"><i class="pi pi-user"></i></span>
    <h2 class="checkout-card__title">{{ 'checkout.contact.heading' | translate }}</h2>
  </div>

  <form [formGroup]="form" class="auth-field-row" novalidate>
    <div class="auth-field" [class.auth-field--invalid]="fieldError('phone')">
      <label class="auth-field__label" for="contact-phone">{{ 'checkout.contact.phoneLabel' | translate }}</label>
      <input
        id="contact-phone"
        type="tel"
        class="auth-field__input"
        formControlName="phone"
        autocomplete="tel"
        [placeholder]="'account.addressForm.phonePlaceholder' | translate"
      />
      <p class="auth-field__error" *ngIf="fieldError('phone') as key">{{ key | translate }}</p>
    </div>

    <div class="auth-field" [class.auth-field--invalid]="fieldError('email')">
      <label class="auth-field__label" for="contact-email">{{ 'checkout.contact.emailLabel' | translate }}</label>
      <input
        id="contact-email"
        type="email"
        class="auth-field__input"
        formControlName="email"
        autocomplete="email"
        [placeholder]="'checkout.contact.emailPlaceholder' | translate"
      />
      <p class="auth-field__error" *ngIf="fieldError('email') as key">{{ key | translate }}</p>
    </div>
  </form>
</section>
