<form [formGroup]="form" class="guest-address-form" novalidate>
  <div class="auth-field" [class.auth-field--invalid]="fieldError('recipientName')">
    <label class="auth-field__label" for="gaf-recipient">{{ 'account.addressForm.recipientNameLabel' | translate }}</label>
    <input
      id="gaf-recipient"
      type="text"
      class="auth-field__input"
      formControlName="recipientName"
      [placeholder]="'account.addressForm.recipientNamePlaceholder' | translate"
    />
    <p class="auth-field__error" *ngIf="fieldError('recipientName') as key">{{ key | translate }}</p>
  </div>

  <div class="auth-field" [class.auth-field--invalid]="fieldError('governorateId')">
    <label class="auth-field__label" for="gaf-governorate">{{ 'account.addressForm.governorateLabel' | translate }}</label>
    <select id="gaf-governorate" class="auth-field__input" formControlName="governorateId">
      <option [ngValue]="null" disabled>{{ 'account.addressForm.governoratePlaceholder' | translate }}</option>
      <option *ngFor="let gov of governorates" [ngValue]="gov.id" [disabled]="!gov.served">{{
        gov.served ? gov.name : gov.name + ' — ' + ('account.addressForm.unavailable' | translate)
      }}</option>
    </select>
    <p class="auth-field__error" *ngIf="fieldError('governorateId') as key">{{ key | translate }}</p>
  </div>

  <div class="auth-field">
    <label class="auth-field__label" for="gaf-area">{{ 'account.addressForm.areaLabel' | translate }}</label>
    <input
      id="gaf-area"
      type="text"
      class="auth-field__input"
      formControlName="area"
      [placeholder]="'account.addressForm.areaPlaceholder' | translate"
    />
  </div>

  <div class="auth-field" [class.auth-field--invalid]="fieldError('streetAddress')">
    <label class="auth-field__label" for="gaf-street">{{ 'account.addressForm.streetLabel' | translate }}</label>
    <input
      id="gaf-street"
      type="text"
      class="auth-field__input"
      formControlName="streetAddress"
      [placeholder]="'account.addressForm.streetPlaceholder' | translate"
    />
    <p class="auth-field__error" *ngIf="fieldError('streetAddress') as key">{{ key | translate }}</p>
  </div>

  <div class="guest-address-form__row-3">
    <div class="auth-field">
      <label class="auth-field__label" for="gaf-building">{{ 'account.addressForm.buildingLabel' | translate }}</label>
      <input
        id="gaf-building"
        type="text"
        class="auth-field__input"
        formControlName="building"
        [placeholder]="'account.addressForm.buildingPlaceholder' | translate"
      />
    </div>

    <div class="auth-field">
      <label class="auth-field__label" for="gaf-floor">{{ 'account.addressForm.floorLabel' | translate }}</label>
      <input
        id="gaf-floor"
        type="text"
        class="auth-field__input"
        formControlName="floor"
        [placeholder]="'account.addressForm.floorPlaceholder' | translate"
      />
    </div>

    <div class="auth-field">
      <label class="auth-field__label" for="gaf-apartment">{{ 'account.addressForm.apartmentLabel' | translate }}</label>
      <input
        id="gaf-apartment"
        type="text"
        class="auth-field__input"
        formControlName="apartment"
        [placeholder]="'account.addressForm.apartmentPlaceholder' | translate"
      />
    </div>
  </div>

  <div class="auth-field" [class.auth-field--invalid]="fieldError('altPhone')">
    <label class="auth-field__label" for="gaf-alt-phone">{{ 'account.addressForm.altPhoneLabel' | translate }}</label>
    <input
      id="gaf-alt-phone"
      type="tel"
      class="auth-field__input"
      formControlName="altPhone"
      [placeholder]="'account.addressForm.phonePlaceholder' | translate"
    />
    <p class="guest-address-form__helper">{{ 'account.addressForm.altPhoneHelper' | translate }}</p>
    <p class="auth-field__error" *ngIf="fieldError('altPhone') as key">{{ key | translate }}</p>
  </div>

  <div class="auth-field">
    <label class="auth-field__label" for="gaf-landmark">{{ 'account.addressForm.landmarkLabel' | translate }}</label>
    <input id="gaf-landmark" type="text" class="auth-field__input" formControlName="landmark" />
    <p class="guest-address-form__helper">{{ 'account.addressForm.landmarkHelper' | translate }}</p>
  </div>

  <div class="auth-field">
    <label class="auth-field__label" for="gaf-note">{{ 'checkout.address.noteLabel' | translate }}</label>
    <textarea
      id="gaf-note"
      class="auth-field__input guest-address-form__textarea"
      formControlName="customerNote"
      rows="3"
      [placeholder]="'checkout.address.notePlaceholder' | translate"
    ></textarea>
  </div>
</form>
