<div class="pw-meter" *ngIf="password">
  <div class="pw-meter__segments">
    <span
      class="pw-meter__segment"
      *ngFor="let index of segmentIndexes"
      [style.background]="index < filledCount ? color : null"
    ></span>
  </div>
  <span class="pw-meter__label" [style.color]="color">{{ labelKey | translate }}</span>
</div>
