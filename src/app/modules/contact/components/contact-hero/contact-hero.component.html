<section class="contact-hero">
  <img
    class="contact-hero__image"
    src="assets/images/contact/banner.png"
    [alt]="'contact.hero.imageAlt' | translate"
    fetchpriority="high"
    loading="eager"
  />
  <span class="contact-hero__scrim" aria-hidden="true"></span>

  <div class="contact-hero__content">
    <span class="contact-hero__eyebrow">{{ 'contact.hero.eyebrow' | translate }}</span>

    <h1 class="contact-hero__heading">{{ 'contact.hero.heading' | translate }}</h1>
    <span class="contact-hero__rule" aria-hidden="true"></span>

    <p class="contact-hero__body">{{ 'contact.hero.body' | translate }}</p>

    <a
      [href]="whatsappUrl"
      target="_blank"
      rel="noopener noreferrer"
      pButton
      pRipple
      class="contact-hero__cta"
    >
      <span>{{ 'contact.hero.cta' | translate }}</span>
      <i class="pi pi-arrow-right contact-hero__cta-icon" aria-hidden="true"></i>
    </a>
  </div>
</section>
